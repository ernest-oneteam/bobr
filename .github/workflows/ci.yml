name: CI (Bazel)

on:
  push:
    branches: ["main", "bazel"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bazel:
    name: Build & test (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test proof scheduling
        run: python3 -m unittest discover -s scripts -p 'test_next_proof_trigger.py'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bazelisk
        run: npm install -g @bazel/bazelisk

      # The cache key is scoped to the lockfiles; restore-keys let a PR reuse the
      # cache produced by an earlier run (including main's), which is exactly how
      # "unaffected targets come from cache across branches" is demonstrated.
      - name: Cache Bazel disk + repository cache
        uses: actions/cache@v4
        with:
          path: |
            .bazel-cache
            ~/.bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-
            bazel-${{ runner.os }}-

      - name: Build everything
        run: bazel build //... --repository_cache=~/.bazel-repo

      # The process summary line (e.g. "12 processes: 10 disk cache hit, 2 ...")
      # is Bazel's own proof of how much CI work was skipped this run.
      - name: Test everything
        run: bazel test //... --repository_cache=~/.bazel-repo

  typecheck:
    name: Application type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Check original sources independently of the tree-shaken runtime build.
      - run: pnpm --filter web --filter docs --filter @repo/ui check-types
