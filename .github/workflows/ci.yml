name: CI (Bazel)

# The whole point of this pipeline: let Bazel's content-addressed cache decide
# what actually needs to run. A PR that touches code used by only one app will
# restore every unaffected target from the cache seeded by `main` — so CI does
# real work only for what changed, consistently across branches.

on:
  push:
    branches: ["main", "bazel"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  bazel:
    name: Build & test (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bazelisk
        run: npm install -g @bazel/bazelisk

      # The cache key is scoped to the lockfiles; restore-keys let a PR reuse the
      # cache produced by an earlier run (including main's), which is exactly how
      # "unaffected targets come from cache across branches" is demonstrated.
      - name: Cache Bazel disk + repository cache
        uses: actions/cache@v4
        with:
          path: |
            .bazel-cache
            ~/.bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-
            bazel-${{ runner.os }}-

      - name: Build everything
        run: bazel build //... --repository_cache=~/.bazel-repo

      # The process summary line (e.g. "12 processes: 10 disk cache hit, 2 ...")
      # is Bazel's own proof of how much CI work was skipped this run.
      - name: Test everything
        run: bazel test //... --repository_cache=~/.bazel-repo

      - name: Prove unused exports skip the real Next builds
        run: python3 scripts/prove-next-invalidation.py --directory "${{ runner.temp }}/bobr-next-proof"
